<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Dev-Agent">
  <defs>
    <linearGradient id="bg-dev-agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="shade-dev-agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid-dev-agent" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-dev-agent)"/>
  <rect width="800" height="600" fill="url(#grid-dev-agent)"/>
  <circle cx="690" cy="-40" r="220" fill="#fff" fill-opacity="0.07"/>
  <circle cx="90" cy="640" r="180" fill="#000" fill-opacity="0.10"/>

<g transform="translate(400,268) scale(1.5)" opacity="0.95">
       <rect x="-108" y="-72" width="216" height="144" rx="12" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.5"/>
       <line x1="-108" y1="-42" x2="108" y2="-42" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
       <circle cx="-90" cy="-57" r="4.5" fill="#fff" fill-opacity="0.55"/>
       <circle cx="-74" cy="-57" r="4.5" fill="#fff" fill-opacity="0.4"/>
       <circle cx="-58" cy="-57" r="4.5" fill="#fff" fill-opacity="0.28"/>
       <path d="M -78 -14 L -54 8 L -78 30" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
       <line x1="-36" y1="30" x2="34" y2="30" stroke="#fff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
     </g>

  <rect width="800" height="600" fill="url(#shade-dev-agent)"/>

  <g font-family="Poppins, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="470" width="82" height="82" rx="22" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.32" stroke-width="2"/>
