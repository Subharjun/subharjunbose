<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Reimbursement Case">
  <defs>
    <linearGradient id="bg-claimagent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="shade-claimagent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid-claimagent" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-claimagent)"/>
  <rect width="800" height="600" fill="url(#grid-claimagent)"/>
  <circle cx="690" cy="-40" r="220" fill="#fff" fill-opacity="0.07"/>
  <circle cx="90" cy="640" r="180" fill="#000" fill-opacity="0.10"/>

<g transform="translate(400,268) scale(1.5)" opacity="0.95">
       <line x1="0" y1="-46" x2="-66" y2="34" stroke="#fff" stroke-opacity="0.4" stroke-width="2.5"/>
       <line x1="0" y1="-46" x2="66" y2="34" stroke="#fff" stroke-opacity="0.4" stroke-width="2.5"/>
       <line x1="-66" y1="34" x2="66" y2="34" stroke="#fff" stroke-opacity="0.4" stroke-width="2.5"/>
       <circle cx="0" cy="-46" r="22" fill="#fff" fill-opacity="0.92"/>
       <circle cx="-66" cy="34" r="18" fill="#fff" fill-opacity="0.62"/>
       <circle cx="66" cy="34" r="18" fill="#fff" fill-opacity="0.62"/>
       <circle cx="0" cy="14" r="10" fill="#fff" fill-opacity="0.35"/>
     </g>

  <rect width="800" height="600" fill="url(#shade-claimagent)"/>

  <g font-family="Poppins, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="470" width="82" height="82" rx="22" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.32" stroke-width="2"/>
    <text x="89" y="524" font-size="34" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0.5">RC</text>
  </g>
</svg>
