<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="SafeDrive AI">
  <defs>
    <linearGradient id="bg-safedrive-ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="shade-safedrive-ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid-safedrive-ai" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-safedrive-ai)"/>
  <rect width="800" height="600" fill="url(#grid-safedrive-ai)"/>
  <circle cx="690" cy="-40" r="220" fill="#fff" fill-opacity="0.07"/>
  <circle cx="90" cy="640" r="180" fill="#000" fill-opacity="0.10"/>

<g transform="translate(400,268) scale(1.5)" opacity="0.95">
       <circle cx="0" cy="0" r="76" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5"/>
       <circle cx="0" cy="0" r="52" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>
       <path d="M -104 0 L -70 0 L -52 -40 L -26 42 L 0 -56 L 26 40 L 46 -22 L 64 0 L 104 0"
             fill="none" stroke="#fff" stroke-opacity="0.95" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
       <circle cx="0" cy="0" r="9" fill="#fff" fill-opacity="0.9"/>
     </g>

  <rect width="800" height="600" fill="url(#shade-safedrive-ai)"/>

  <g font-family="Poppins, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="470" width="82" height="82" rx="22" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.32" stroke-width="2"/>
    <text x="89" y="524" font-size="34" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0.5">SD</text>
  </g>
</svg>
