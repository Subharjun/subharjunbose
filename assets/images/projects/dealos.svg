<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="DealOS">
  <defs>
    <linearGradient id="bg-dealos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="shade-dealos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid-dealos" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-dealos)"/>
  <rect width="800" height="600" fill="url(#grid-dealos)"/>
  <circle cx="690" cy="-40" r="220" fill="#fff" fill-opacity="0.07"/>
  <circle cx="90" cy="640" r="180" fill="#000" fill-opacity="0.10"/>

  <g transform="translate(400,268) scale(1.5)" opacity="0.95">
    <rect x="-80" y="-55" width="160" height="110" rx="10" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5"/>
    <path d="M -50 25 L -20 -10 L 10 10 L 50 -35" fill="none" stroke="#fff" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-50" cy="25" r="5" fill="#fff" fill-opacity="0.9"/>
    <circle cx="-20" cy="-10" r="5" fill="#fff" fill-opacity="0.9"/>
    <circle cx="10" cy="10" r="5" fill="#fff" fill-opacity="0.9"/>
    <circle cx="50" cy="-35" r="6" fill="#fff" fill-opacity="0.95"/>
    <line x1="-80" y1="-25" x2="80" y2="-25" stroke="#fff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <rect width="800" height="600" fill="url(#shade-dealos)"/>

  <g font-family="Poppins, 'Segoe UI', system-ui, sans-serif">
    <rect x="48" y="470" width="82" height="82" rx="22" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.32" stroke-width="2"/>
    <text x="89" y="524" font-size="34" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0.5">DO</text>
  </g>
